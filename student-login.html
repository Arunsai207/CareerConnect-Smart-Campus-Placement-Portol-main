<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login/Register</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .form-container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            width: 350px;
        }

        .form-container h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .form-container form {
            display: flex;
            flex-direction: column;
        }

        .form-container input,
        .form-container select {
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .form-container button {
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .form-container button:hover {
            background-color: #0056b3;
        }

        .form-container .toggle-btn {
            background: none;
            border: none;
            color: #007bff;
            text-decoration: underline;
            cursor: pointer;
            padding: 0;
        }

        .error-message {
            color: red;
            text-align: center;
            display: none;
        }

        .gender-container {
            display: flex;
            justify-content: space-between;
        }

        .form-container input[type="radio"] {
            margin-right: 10px;
            display: inline-block;
        }

        .form-container label {
            margin-right: 20px;
            display: inline-block;
            font-weight: normal;
        }

        /* Style for Back to Index link */
        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #007bff;
            text-decoration: underline;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>

<body>
    <div class="form-container" id="loginFormContainer">
        <h2>Student Login</h2>
        <form id="studentLoginForm" onsubmit="validateLoginForm(event)">
            <label class="sr-only" for="loginUsername">Username</label>
            <input type="text" id="loginUsername" name="username" placeholder="Username" autocomplete="username" required>
            <label class="sr-only" for="loginPassword">Password</label>
            <input type="password" id="loginPassword" name="password" placeholder="Password" autocomplete="current-password" required>
            <div class="error-message" id="loginErrorMessage">Invalid username or password.</div>
            <button type="submit">Login</button>
        </form>
        <p style="text-align:center;">Don't have an account? <button class="toggle-btn" onclick="toggleForms()">Register here</button></p>
        <!-- Back to Index Link -->
        <div class="back-link">
            <a href="index.html">Back to Index</a>
        </div>
    </div>

    <div class="form-container" id="registerFormContainer" style="display:none;">
        <h2>Student Register</h2>
        <form id="studentRegisterForm" onsubmit="validateRegisterForm(event)">
            <label class="sr-only" for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Full Name" autocomplete="name" required>
            <label class="sr-only" for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Email" autocomplete="email" required>
            <label class="sr-only" for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="Phone Number" autocomplete="tel" required>
            <label class="sr-only" for="dob">Date of Birth</label>
            <input type="date" id="dob" name="bday" placeholder="Date of Birth" autocomplete="bday" required>
            <label class="sr-only" for="college">College Name</label>
            <input type="text" id="college" name="organization" placeholder="College Name" autocomplete="organization" required>

            <!-- Department Dropdown -->
            <label class="sr-only" for="department">Department</label>
            <select id="department" name="department" required>
                <option value="">Select Department</option>
                <option value="COMPS">COMPS</option>
                <option value="MECH">MECH</option>
                <option value="EXTC">EXTC</option>
                <option value="IT">IT</option>
                <option value="CIVIL">CIVIL</option>
                <option value="MCA">MCA</option>
                <option value="AI&DS">AI&DS</option>
            </select>

            <!-- Gender Radio Buttons -->
            <div class="gender-container">
                <div>
                    <input type="radio" id="male" name="gender" value="Male" required>
                    <label for="male">Male</label>
                </div>
                <div>
                    <input type="radio" id="female" name="gender" value="Female" required>
                    <label for="female">Female</label>
                </div>
            </div>

            <label class="sr-only" for="registerUsername">Username</label>
            <input type="text" id="registerUsername" name="new-username" placeholder="Username" autocomplete="username" required>
            <label class="sr-only" for="registerPassword">Password</label>
            <input type="password" id="registerPassword" name="new-password" placeholder="Password" autocomplete="new-password" required>
            <div class="error-message" id="registerErrorMessage">Please fill out all fields.</div>
            <button type="submit" id="registerButton">Register</button>
        </form>
        <p style="text-align:center;">Already have an account? <button class="toggle-btn" onclick="toggleForms()">Login here</button></p>
        
        <div class="back-link">
            <a href="index.html">Back to Index</a>
        </div>
    </div>

    <script>
        function toggleForms() {
            var loginForm = document.getElementById('loginFormContainer');
            var registerForm = document.getElementById('registerFormContainer');
            document.getElementById('loginErrorMessage').style.display = 'none'; 
            document.getElementById('registerErrorMessage').style.display = 'none'; 
            if (loginForm.style.display === 'none') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
            }
        }

        function validateLoginForm(event) {
            event.preventDefault(); 
            var username = document.getElementById('loginUsername').value.trim();
            var password = document.getElementById('loginPassword').value;
        
            fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ username, password }),
            })
            .then(response => response.json())
            .then(data => {
                if (data.message === 'Login successful') {
                    ['fullName', 'username', 'email', 'aptitudeScore', 'dsaScore', 'interviewScore', 'resumeScore'].forEach(function (key) {
                        localStorage.removeItem(key);
                    });
                    if (data.token) localStorage.setItem('careerconnectToken', data.token);
                    // Save user info so dashboard can display the correct name
                    try {
                        // If server returns a user object, prefer that
                        if (data.user) {
                            localStorage.setItem('fullName', data.user.name || username);
                            if (data.user.email) localStorage.setItem('email', data.user.email);
                            localStorage.setItem('username', data.user.username || username);
                        } else if (data.name) {
                            // Some APIs return the name directly
                            localStorage.setItem('fullName', data.name);
                            if (data.email) localStorage.setItem('email', data.email);
                            localStorage.setItem('username', username);
                        } else {
                            // Fallback: store the login username
                            localStorage.setItem('fullName', username);
                            localStorage.setItem('username', username);
                        }
                    } catch (e) {
                        console.warn('Failed to persist user info to localStorage', e);
                        localStorage.setItem('fullName', username);
                    }

                    // Redirect to dashboard
                    window.location.href = "studentdashboard.html";  
                } else {
                    document.getElementById('loginErrorMessage').style.display = 'block';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('loginErrorMessage').style.display = 'block';
                document.getElementById('loginErrorMessage').innerText = 'An error occurred during login.';
            });
        }
        
        function registrationDetails() {
            return {
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                dob: document.getElementById('dob').value,
                college: document.getElementById('college').value.trim(),
                department: document.getElementById('department').value,
                gender: document.querySelector('input[name="gender"]:checked')?.value,
                username: document.getElementById('registerUsername').value.trim(),
                password: document.getElementById('registerPassword').value
            };
        }

        async function validateRegisterForm(event) {
            event.preventDefault(); // Prevent the default form submission
            var details = registrationDetails();
            try {
                var response = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(details)
                })
                var data = await response.json();
                if (response.ok) {
                    alert(data.message);
                    document.getElementById('studentRegisterForm').reset();
                    toggleForms(); // Switch to login form after registration
                } else {
                    document.getElementById('registerErrorMessage').style.display = 'block';
                    document.getElementById('registerErrorMessage').innerText = data.message || 'Registration failed.';
                }
            } catch (error) {
                console.error('Registration error:', error);
                document.getElementById('registerErrorMessage').style.display = 'block';
                document.getElementById('registerErrorMessage').innerText = 'An error occurred during registration.';
            }
        }
    </script>
</body>

</html>
