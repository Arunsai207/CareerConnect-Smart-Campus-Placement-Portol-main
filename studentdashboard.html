<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Dashboard</title>
  <style>
    /* CSS styles go here */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
    }

    .dashboard {
      display: flex;
      width: 100%;
      height: 100%;
    }

    .sidebar {
      width: 250px;
      background-color: #2c3e50;
      color: white;
      padding: 20px;
      height: 100%;
    }

    .sidebar h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
    }

    .sidebar ul li {
      margin-bottom: 15px;
    }

    .sidebar ul li a {
      color: white;
      text-decoration: none;
      font-size: 18px;
      display: block;
      padding: 10px;
      border-radius: 5px;
      transition: background-color 0.3s;
    }

    .sidebar ul li a:hover {
      background-color: #34495e;
    }

    .main-content {
      flex-grow: 1;
      padding: 20px;
      background-color: #ecf0f1;
    }

    .main-content h1 {
      margin-top: 0;
    }

    #content {
      margin-top: 20px;
      padding: 20px;
      background-color: white;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    .performance-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }

    .performance-card {
      padding: 18px;
      border-radius: 8px;
      background: #f5f7fa;
      border-left: 4px solid #2c3e50;
    }

    .performance-card h3 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .performance-card strong,
    .performance-card small {
      display: block;
    }

    .performance-card strong {
      font-size: 22px;
      color: #2c3e50;
    }

    .performance-card small,
    .performance-note {
      color: #667085;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
    }

    .form-group input {
      width: 60%;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    .form-actions {
      margin-top: 20px;
    }

    .form-actions button {
      padding: 10px 20px;
      background-color: #2c3e50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .form-actions button:hover {
      background-color: #34495e;
    }

    .button-container {
      margin: 0rem 0rem 2.5rem 7rem;
      height: 100%;
    }

    .btn {
      border: 1px solid #000;
      background-color: transparent;
      color: #000;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
    }

    .btn:hover {
      background-color: #000;
      color: #fff;
    }

    .btn a {
      text-decoration: none;
      color: inherit;
    }

    .btn a:hover {
      color: inherit;
    }

    .announcement {
      margin-bottom: 20px;
    }

    .announcement h3 {
      margin-bottom: 10px;
    }

    .announcement p {
      font-size: 16px;
      line-height: 1.5;
    }

    .announcement small {
      color: #777;
    }
  </style>
</head>

<body>
  <div class="dashboard">
    <div class="sidebar">
      <h2>Student Portal</h2>
      <ul>
        <li><a href="#" id="dashboard">Dashboard</a></li>
        <li><a href="#" id="aptitude">Aptitude</a></li>
        <li><a href="#" id="tech">DSA Practice</a></li>
        <li><a href="#" id="Mockinterview">Mock-Interview</a></li>
        <li><a href="#" id="resume">Resume Builder</a></li>
        <li><a href="#" id="resumeats">Resume Scanner</a></li>
        <li><a href="#" id="announcements">Announcements</a></li>
        <li><a href="#" id="profile">Profile</a></li>
        <li><a href="#" id="logout">Logout</a></li>
      </ul>
    </div>

    <div class="main-content">
      <h1>Welcome, <span id="fullName">Student</span></h1>
      <div id="content"></div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const content = document.getElementById('content');

      // Fetch the full name from localStorage
      const fullName = localStorage.getItem('fullName');
      if (fullName) {
        document.getElementById('fullName').textContent = fullName;
      }

      async function showDashboard() {
        const username = localStorage.getItem('username') || 'Not available';
        let aptitudeScore = localStorage.getItem('aptitudeScore') || 'Not attempted';
        let performanceMessage = '';
        if (username !== 'Not available') {
          try {
            const response = await fetch(`http://localhost:3000/api/students/${encodeURIComponent(username)}/performance`, {
              headers: { Accept: 'application/json' },
              cache: 'no-store'
            });
            const responseText = await response.text();
            let performance;
            try {
              performance = JSON.parse(responseText);
            } catch (parseError) {
              throw new Error(`Server returned ${response.status} ${response.statusText}, not JSON. Restart Node with "npm start".`);
            }
            if (!response.ok) {
              throw new Error(performance.error || `Request failed (${response.status})`);
            }
            if (performance.aptitude) {
              aptitudeScore = `${performance.aptitude.score}/${performance.aptitude.total} (${performance.aptitude.accuracy}%)`;
            } else {
              performanceMessage = '<p class="performance-note">No aptitude result was found for this username. Use the same username in the quiz and dashboard.</p>';
            }
          } catch (error) {
            console.error('Unable to load aptitude performance:', error);
            performanceMessage = `<p class="performance-note">Performance could not be loaded: ${error.message}</p>`;
          }
        }
        const dsaScore = localStorage.getItem('dsaScore') || 'Not attempted';
        const interviewScore = localStorage.getItem('interviewScore') || 'Not attempted';
        const resumeScore = localStorage.getItem('resumeScore') || 'Not scanned';

        content.innerHTML = `
          <h2>Dashboard</h2>
          <p>Welcome to your dashboard. Here is an overview of your activities and performance.</p>
          <p><strong>Username:</strong> ${username}</p>
          <div class="performance-grid">
            <div class="performance-card"><h3>Aptitude</h3><strong>${aptitudeScore}</strong><small>Latest score</small></div>
            <div class="performance-card"><h3>DSA Practice</h3><strong>${dsaScore}</strong><small>Latest score</small></div>
            <div class="performance-card"><h3>Mock Interview</h3><strong>${interviewScore}</strong><small>Latest score</small></div>
            <div class="performance-card"><h3>Resume ATS</h3><strong>${resumeScore}</strong><small>Latest score</small></div>
          </div>
          ${performanceMessage || '<p class="performance-note">Complete an activity to see its score here. Scores are saved by each activity when available.</p>'}
        `;
      }

      // Dashboard Section
      document.getElementById('dashboard').addEventListener('click', function (event) {
        event.preventDefault();
        showDashboard();
      });
      showDashboard();

      // Aptitude Section with two inner buttons
      document.getElementById('aptitude').addEventListener('click', function (event) {
        event.preventDefault();
        content.innerHTML = `
            <h2>Aptitude Options</h2>
            <button id="quizButton" class="btn">Aptitude Quiz</button>
            <button id="dashboardButton" class="btn">Result Analysis & Visualization</button>
          `;
        document.getElementById('quizButton').addEventListener('click', function () {
          window.location.href = 'http://localhost:8501';
        });
        document.getElementById('dashboardButton').addEventListener('click', function () {
          window.location.href = 'http://localhost:8502';
        });
      });

      // MOckinterview
      document.getElementById('Mockinterview').addEventListener('click', function (event) {
        event.preventDefault();
        content.innerHTML = `
            <h2>Mock Interview</h2>
            <button id="interButton" class="btn">Start Interview</button>
            `;
        document.getElementById('interButton').addEventListener('click', function () {
          window.location.href = 'interview.html';
        });
      });

      // Resume Builder Section
      document.getElementById('resume').addEventListener('click', function () {
        content.innerHTML = `
            <h2>Resume</h2>
            <p>Create Your Professional Resume With Resume Builder</p>
            <div class="row">
              <div class="button-container">
                <button type="button" class="btn">
                  <a href="Form.html">Create Your Resume</a>
                </button>
              </div>
            </div>
          `;
      });

      // Resume Scanner Section
      document.getElementById('resumeats').addEventListener('click', function () {
        content.innerHTML = `
            <h2>Resume</h2>
            <p>Check if your Resume is Job Ready</p>
            <div class="row">
              <div class="button-container">
                <button type="button" class="btn">
                  <a href="http://localhost:8506">Start ATS Scan</a>
                </button>
              </div>
            </div>
          `;
      });

      // Announcements Section with fetch request
      document.getElementById('announcements').addEventListener('click', function () {
        content.innerHTML = '<h2>Announcements</h2><p>Loading announcements...</p>';
        fetch('http://localhost:3000/announcements')
          .then((response) => response.json())
          .then((data) => {
            if (data.length > 0) {
              let announcementsHtml = '';
              data.forEach((announcement) => {
                announcementsHtml += `
                    <div class="announcement">
                      <h3>${announcement.title}</h3>
                      <p>${announcement.content}</p>
                      <p><small>Published on: ${new Date(announcement.createdAt).toLocaleString()}</small></p>
                    </div>
                    <hr/>
                  `;
              });
              content.innerHTML = `<h2>Announcements</h2>${announcementsHtml}`;
            } else {
              content.innerHTML = '<h2>Announcements</h2><p>No announcements available.</p>';
            }
          })
          .catch((error) => {
            content.innerHTML = '<h2>Announcements</h2><p>Failed to load announcements. Please try again later.</p>';
          });
      });

      // Profile Section
      document.getElementById('profile').addEventListener('click', function () {
        const storedFullName = localStorage.getItem('fullName') || '';
        const storedEmail = localStorage.getItem('email') || '';
        content.innerHTML = `
            <h2>Profile</h2>
            <form id="profileForm">
              <div class="form-group">
                <label for="fullNameInput">Full Name</label>
                <input type="text" id="fullNameInput" value="${storedFullName}" />
              </div>
              <div class="form-group">
                <label for="emailInput">Email</label>
                <input type="email" id="emailInput" value="${storedEmail}" />
              </div>
              <div class="form-group">
                <label for="passwordInput">Password</label>
                <input type="password" id="passwordInput" placeholder="Enter new password" />
              </div>
              <div class="form-actions">
                <button type="submit">Save Changes</button>
              </div>
            </form>
          `;
        document.getElementById('profileForm').addEventListener('submit', function (event) {
          event.preventDefault();
          const newFullName = document.getElementById('fullNameInput').value;
          const newEmail = document.getElementById('emailInput').value;
          const newPassword = document.getElementById('passwordInput').value;
          localStorage.setItem('fullName', newFullName);
          localStorage.setItem('email', newEmail);
          if (newPassword) {
            localStorage.setItem('password', newPassword);
          }
          document.getElementById('fullName').textContent = newFullName;
          content.innerHTML = '<p>Your profile has been updated successfully!</p>';
        });
      });

      // Logout Section
      document.getElementById('logout').addEventListener('click', function () {
        localStorage.clear();
        window.location.href = 'student-login.html';
      });

      // DSA Practice Section with two inner buttons for DSA_app.py and DSA_dash.py
      document.getElementById('tech').addEventListener('click', function (event) {
        event.preventDefault();
        content.innerHTML = `
            <h2>DSA Practice Options</h2>
            <button id="dsaQuestionsButton" class="btn">DSA Questions</button>
            <button id="dsaAnalysisButton" class="btn">DSA Analysis</button>
          `;
        document.getElementById('dsaQuestionsButton').addEventListener('click', function () {
          window.location.href = 'http://localhost:8503';
        });
        document.getElementById('dsaAnalysisButton').addEventListener('click', function () {
          window.location.href = 'http://localhost:8504';
        });
      });
    });
  </script>
</body>

</html>
